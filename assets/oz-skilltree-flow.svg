<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1120 420">
  <title id="title">OzSkillTree protocol flow</title>
  <desc id="desc">A minimal protocol diagram showing a risky stale-plan task routed through oz-start, context fingerprint, negative-memory retrieval, Failure Radar, Countermap, YBR route, bounded execution, and truth-state proof with OzReceipt.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d7dde8; stroke-width: 1.5; }
      .risk { fill: #fff7ed; stroke: #f59e0b; }
      .start { fill: #eef2ff; stroke: #6366f1; }
      .proof { fill: #ecfdf5; stroke: #10b981; }
      .text { fill: #172033; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 650; }
      .small { fill: #526071; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 500; }
      .label { fill: #334155; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0; text-transform: uppercase; }
      .line { stroke: #4f5d75; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .quiet { stroke: #c4ccd8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="420" rx="0"/>

  <text class="label" x="44" y="38">OzSkillTree evidence-first route</text>
  <text class="small" x="44" y="60">Predict failure, route safely, prove the result, leave a receipt.</text>

  <rect class="panel risk" x="44" y="98" width="150" height="96" rx="8"/>
  <text class="text" x="64" y="130">Risky task</text>
  <text class="small" x="64" y="154">stale plan</text>
  <text class="small" x="64" y="174">wrong surface</text>

  <path class="line" d="M 202 146 L 256 146"/>

  <rect class="panel start" x="268" y="98" width="132" height="96" rx="8"/>
  <text class="text" x="293" y="138">/oz-start</text>
  <text class="small" x="292" y="162">opens mission</text>

  <path class="line" d="M 408 146 L 462 146"/>

  <rect class="panel" x="474" y="86" width="168" height="120" rx="8"/>
  <text class="text" x="497" y="122">Context</text>
  <text class="small" x="497" y="146">fingerprint</text>
  <line class="quiet" x1="497" y1="160" x2="619" y2="160"/>
  <text class="small" x="497" y="182">negative memory</text>

  <path class="line" d="M 650 146 L 704 146"/>

  <rect class="panel" x="716" y="68" width="150" height="72" rx="8"/>
  <text class="text" x="738" y="101">Failure</text>
  <text class="small" x="738" y="122">Radar</text>

  <path class="line" d="M 791 146 L 791 168"/>

  <rect class="panel" x="716" y="172" width="150" height="72" rx="8"/>
  <text class="text" x="738" y="205">Countermap</text>
  <text class="small" x="738" y="226">prevents drift</text>

  <path class="line" d="M 874 208 L 928 208"/>

  <rect class="panel" x="940" y="172" width="136" height="72" rx="8"/>
  <text class="text" x="969" y="205">YBR</text>
  <text class="small" x="969" y="226">route wins</text>

  <path class="line" d="M 1008 244 C 1008 260 980 260 940 260 L 430 260 L 430 272"/>

  <rect class="panel" x="250" y="275" width="360" height="84" rx="8"/>
  <text class="text" x="274" y="310">Bounded execution</text>
  <text class="small" x="274" y="334">local scope, stop conditions, targeted checks</text>

  <path class="line" d="M 618 317 L 672 317"/>

  <rect class="panel proof" x="680" y="275" width="396" height="84" rx="8"/>
  <text class="text" x="704" y="310">Truth-state proof + OzReceipt</text>
  <text class="small" x="704" y="334">evidence, tags, closeout</text>
</svg>
